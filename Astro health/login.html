<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTROHEALTH | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="stars"></div>

    <div class="login-container">
        <h1>🚀 ASTROHEALTH</h1>
        <p class="subtitle">Astronaut Health Monitoring System</p>

        <div class="login-box">
            <h2>Welcome Astronaut</h2>
            <p>Access Your Mission Dashboard</p>

            <form onsubmit="login(event)">
                <input type="email" id="email"
                    placeholder="Enter your email" required>

                <input type="password" id="password"
                    placeholder="Enter password (6+ characters)"
                    minlength="6" required>
<input
  type="text"
  id="username"
  placeholder="Enter your name"
  required
/>
                <button type="submit">LOGIN TO MISSION</button>
            </form>

            <p id="login-message"></p>
        </div>

        <p class="footer">🌎 Monitoring Health Beyond Earth</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
